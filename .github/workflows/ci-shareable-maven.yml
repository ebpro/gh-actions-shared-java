name: Java CI (shareable)

# Thanks to https://github.com/apache/maven-gh-actions-shared/
on:
    workflow_call:
      inputs:
        runs-on:
          description: The runner to use
          required: false
          default: '[ self-hosted, Linux ]'
          type: string
        maven-args:
          description: The arguments to pass to all Maven commands when building the code
          required: false
          default: '-D"invoker.streamLogsOnFailures"'
          type: string
  
        jdk-matrix:
          description: jdk matrix as json array
          required: false
          default: '[ "21" ]'
          type: string
  
        jdk-distribution-matrix:
          description: jdk distribution matrix
          required: false
          default: '[ "temurin" ]'
          type: string
  
        maven-matrix:
          description: The Maven version matrix as json array
          required: false
          default: '[ "3.9.8" ]'
          type: string
  
        matrix-exclude:
          description: exclude for matrix as json
          required: false
          default: '[]'
          type: string
    
        verify-goal:
          description: The Maven goal used to verify jobs
          required: false
          default: 'verify'
          type: string

        quality-goal-run:
            description: Should run quality ?
            required: false
            default: 'false'
            type: string
        quality-goal:
            description: The Maven goal used to check code quality
            required: false
            default: |
              -DskipTests=true \
              -Dsonar.branch.name=$MY_BRANCH \
              --activate-profiles jacoco,sonar \
              sonar:sonar
            type: string      

        deploy-goal-run:
            description: Should deploy ?
            required: false
            default: 'false'
            type: string
        deploy-goal:
            description: The Maven goal used deploy project
            required: false
            default: 'deploy'
            type: string

        site-goal-run:
            description: Should genarate and deploy the website ?
            required: false
            default: 'false'
            type: string
        site-goal:
            description: The Maven goal used to build and deploy web site
            required: false
            default: 'site:site site-deploy'
            type: string

        staging-goal-run:
            description: Should stage artefacts ?
            required: false
            default: 'false'
            type: string
        staging-command:
            description: The command to make a staging directory containing artefacts.
            required: false
            default: 'mkdir staging && find ./target -name \*.[jwe]ar -exec cp {} ./staging \; && ls staging'
            type: string
env:
  GITHUBACTOR: ${{ secrets.GITHUBACTOR }}
  GITHUBTOKEN: ${{ secrets.GITHUBTOKEN }}
  GITHUBORG: ${{ secrets.GITHUBORG }}
  SONAR_URL: ${{ secrets.SONAR_URL }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  SIGN_KEY_PASS: ${{ secrets.SIGN_KEY_PASS }}
  SIGN_KEY: ${{ secrets.SIGN_KEY }}
  MAVEN_PROXY_URL: ${{ secrets.MAVEN_PROXY_URL }}
  MAVEN_PROXY_USERNAME: ${{ secrets.MAVEN_PROXY_USERNAME }}
  MAVEN_PROXY_TOKEN: ${{ secrets.MAVEN_PROXY_TOKEN }}

# allow single build per branch or PR
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
  
jobs:
  # This job build, test and stage the artefact and the website for the develop branch
  maven-build-test-site:
    name: jdk-${{ matrix.jdk }}-${{ matrix.distribution }} ${{ matrix.maven }}
    # The tags to select the runner
    runs-on: ${{ inputs.runs-on }}

    strategy:
        matrix:
          jdk: ${{ fromJSON( inputs.jdk-matrix ) }}
          distribution: ${{ fromJSON( inputs.jdk-distribution-matrix ) }}
          maven: ${{ fromJSON( inputs.maven-matrix ) }}
          exclude: ${{ fromJSON( inputs.matrix-exclude ) }}
  
    steps:
      - name: Install dependencies
        run: sudo apt update && sudo apt install git -y
      ## Environment setup
      # checkout the repository
      - name: Source checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      # Setups git user name and email
      - name: Setup git User
        run: |
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com        
      # Maven is not installed in self hosted
      # so we install one (see wrapper below for the right version)
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
            maven-version: ${{ matrix.maven }}  
     # Installs the JDK
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.jdk }}
          check-latest: true
          # cache: 'maven'
      # Setup maven version as a wrapper
      - name: Setup Maven Wrapper
        run: |
          mvn ${{ inputs.maven-args }} wrapper:wrapper \
              -Dmaven="${{ matrix.maven }}"

      - name: Extract branch name
        shell: bash
        run: echo "MY_BRANCH=$(git rev-parse --abbrev-ref HEAD | tr / _)" >> $GITHUB_ENV

      # Build and test
      - name: Build and Test with Maven
        run: |
          ./mvnw ${{ inputs.maven-args }} ${{ inputs.verify-goal }}

      # Check quality with SonarQube
        ### THIS STEP MUST BE ENABLED BY CONFIGURING: 
        ###      SONAR_URL and SONAR_TOKEN secrets.
      - name: Quality check with Sonarqube
        if: ${{ (inputs.quality-goal-run == 'true') && (env.SONAR_URL != null) && (env.SONAR_TOKEN != null) }}
        run: |
          ./mvnw ${{ inputs.maven-args }} ${{ inputs.quality-goal }}

      # Stage artifact to github
      - name: Build artifacts archive
        if: ${{ inputs.staging-goal-run == 'true' }}
        run: ${{ inputs.staging-command }}
      - name: Upload artifacts archive
        uses: actions/upload-artifact@v4
        if: ${{ inputs.staging-goal-run == 'true' }}
        with:
          name: Package
          path: staging
      
      # Publish artefact
      - name: Deploy artefact
        if: ${{ inputs.deploy-goal-run == 'true' }}
        run: |
          ./mvnw ${{ inputs.maven-args }} ${{ inputs.deploy-goal }}
      
      ## Build and deploy project site      
      - name: Load SSH Key in agent
        if: ${{ (inputs.site-goal-run == 'true') && (github.ref == 'refs/heads/develop') }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Build and deploy website with Maven
        if: ${{ (inputs.site-goal-run == 'true')  && (github.ref == 'refs/heads/develop') }}
        run: |
          mkdir -p ~/.ssh/ && touch ~/.ssh/known_hosts
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ./mvnw ${{ inputs.maven-args }} ${{ inputs.site-goal }}